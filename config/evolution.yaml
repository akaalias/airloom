# Evolution-loop hyper-parameters.
optimizer: ga            # ga | cmaes (cmaes has no discrete parents; see README)
population: 16
generations: 40
seed: null    # null = each new run draws a random seed (logged + stored in
              # run.db; resume replays it exactly). Set an int (e.g. 42) to
              # make from-scratch runs reproducible.

ga:
  tournament_k: 3
  elitism: 2                   # top-N carried over unchanged ("elite" operator)
  crossover_prob: 0.9          # else the child is a pure mutant of one parent
  sbx_eta: 8.0                 # SBX distribution index (higher = children closer to parents)
  mutation_prob_per_gene: 0.35
  mutation_sigma0: 0.18        # gaussian sigma, fraction of each gene's range
  mutation_sigma_decay: 0.97   # per generation
  mutation_sigma_min: 0.03
  immigrant_prob: 0.10         # chance a non-elite slot is a fresh random genome
  repair:
    # Hard constraints are pure geometry (no simulation) -- cheap to check
    # before spending a population slot. See run_20260714_015948 post-
    # mortem: 43% of all 562 evaluations were invalid over the run
    # (immigrant 90%, seed 73%, pivot 60%, crossover 37%, designer only
    # 10%) -- almost entirely tongue/rotor/deck-gap geometry and per-
    # material plate-thickness failures the pre-screen catches for free.
    enabled: true
    max_bisect_steps: 6          # crossover/mutation/pivot: bisect an
                                  # infeasible child back toward its parent
    immigrant_max_resamples: 8   # immigrants/gen-0 seeds: resample the box
                                  # instead of accepting the first (usually
                                  # infeasible) draw
  # -- patience: how long the run may plateau before pivoting.
  # Derived from run data: healthy searches improve the best-so-far by
  # >=0.5% every 1-4 generations; plateaus coincide with population
  # diversity collapsing below ~0.1. After `generations` without a
  # significant improvement, a PIVOT generation breeds `pivot_fraction` of
  # the non-elite slots from (tournament winner) x (far parent) -- the most
  # genetically distant still-decent candidate in the run's history -- with
  # mutation sigma boosted. Escalates to fully random far-parents if the
  # plateau survives another patience window. Elites are never touched.
  patience:
    enabled: true
    generations: 3
    # was 0.005 (0.5%): gens_since_significant_improvement compares each
    # generation against the running best, which itself creeps down every
    # generation once the search is this converged -- real, compounding
    # progress (6.051->5.992 agg, ~1% over 13 gens in run_20260714_015948)
    # never crossed a 0.5% SINGLE-STEP bar, so pivot rank grew unbounded
    # (13 stalled gens -> rank 3, fully escalated) and every designer round
    # became a "pivot" that explicitly forbids refining the elites -- see
    # 2026-07-24 post-mortem. Re-run against that same history: 0.0015
    # brings stall down to 3 gens / pivot_rank 1 (a mild far-parent pivot,
    # not full random-abandon), while still catching genuinely flat
    # stretches like gens 13-38 of that run.
    min_rel_improvement: 0.0015  # what counts as "moving the needle"
    pivot_fraction: 0.5          # non-elite slots bred with a far parent
    # sigma_boost was 3.0: in run_20260714_015948, pivots fired almost
    # every generation from g13 onward (patience kept re-triggering) yet
    # had a WORSE invalid rate (60%) than plain crossover (37%) and never
    # beat crossover's best fitness -- the boosted mutation was mostly
    # overshooting straight into infeasible geometry, not finding real
    # diversity. Lowered now that `repair` (above) reclaims most of those
    # overshoots instead of wasting the slot; revisit alongside repair.
    sigma_boost: 1.6              # hypermutation multiplier while pivoting
    decent_factor: 1.3           # far parents must be within 30% of best

cmaes:
  sigma0: 0.25                 # fraction of normalized [0,1] genome space

designer:
  # Headless-Claude design rounds: every K generations -- and additionally
  # whenever patience declares a pivot ("take a step back" ask) -- `claude
  # -p` receives the best-per-generation trajectory, the elites with their
  # per-scenario results, how its own earlier proposals fared, and the
  # failure histogram, and proposes new genome vectors (operator
  # `designer`). Fail-soft: skipped if the CLI is unavailable. Prompts and
  # outcomes land in run.db (shown per generation in the gallery) and
  # results/designer_log.md. `airloom run --inspiration ideas.md` feeds a
  # user-written idea file into every design round.
  enabled: true
  every_generations: 3
  candidates: 3
  gen0_candidates: 5           # Claude-designed slots in the initial
                               # population (replace random seeds; 0 = off)
  model: "claude-sonnet-5"     # fast; empty = the claude CLI's default model
  timeout_s: 300

narrator:
  # Lab-notebook notes: after each generation, ONE headless-Claude call
  # writes a human-readable hypothesis / method / result for every new
  # candidate (rule-based fallback if the CLI is unavailable). Shown in the
  # gallery detail blocks and the family-tree hover cards.
  enabled: true
  model: "claude-sonnet-5"     # fast; empty = the claude CLI's default model
  timeout_s: 300

execution:
  workers: auto                # auto = os.cpu_count()
  task_timeout_s: 180          # per subprocess (build or scenario task)
  results_dir: results
